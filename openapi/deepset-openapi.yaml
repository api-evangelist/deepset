components:
  schemas:
    APIKey:
      properties:
        id:
          description: The unique identifier of the API key with which the request
            was made.
          format: uuid
          title: API Key ID
          type: string
        name:
          default: ''
          description: Name of the API key.
          title: API Key Name
          type: string
      required:
      - id
      title: APIKey
      type: object
    APITokenResult:
      properties:
        api_token:
          description: API token with the prefix `api_`. This token inherits all permissions
            of the user that created it, and acts on behalf of this user.
          title: API Token
          type: string
        api_token_id:
          description: Unique identifier of the API token.
          format: uuid
          title: API Token ID
          type: string
      required:
      - api_token
      - api_token_id
      title: APITokenResult
      type: object
    AWSAssumeRoleCredentials:
      properties:
        role_arn:
          description: The role which Haystack Enterprise Platform should assume to
            access your bucket.
          title: Role ARN
          type: string
        role_session_name:
          description: The identifier for the assumed role session which Haystack
            Enterprise Platform uses to access your bucket.
          title: Role Session Name
          type: string
      required:
      - role_arn
      - role_session_name
      title: AWSAssumeRoleCredentials
      type: object
    Action:
      description: "Actions are the operations that can be performed on an asset.\n\n        Currently defined actions are:\n\n        - read\n\n        - write\n\n\n        When allowing write we assume that users can also read.\n\n        This is a simplification that we can revisit later."
      enum:
      - read
      - write
      title: Action
      type: string
    AddRoleBody:
      properties:
        description:
          description: The description of the role
          title: Description
          type: string
        permissions:
          description: The permissions of the role
          items:
            $ref: '#/components/schemas/Permission'
          title: Permissions
          type: array
        role_name:
          description: The name of the role
          title: Role Name
          type: string
      required:
      - role_name
      - description
      - permissions
      title: AddRoleBody
      type: object
    AssetCollection:
      description: Collection of all assets with their information.
      properties:
        assets:
          items:
            $ref: '#/components/schemas/AssetInfo'
          title: Assets
          type: array
      required:
      - assets
      title: AssetCollection
      type: object
    AssetInfo:
      description: Information about an asset including its name, description and\n        allowed actions.
      properties:
        actions:
          items:
            $ref: '#/components/schemas/Action'
          title: Actions
          type: array
        asset:
          $ref: '#/components/schemas/Assets'
        description:
          title: Description
          type: string
        family:
          title: Family
          type: string
        title:
          title: Title
          type: string
      required:
      - asset
      - description
      - family
      - actions
      - title
      title: AssetInfo
      type: object
    Assets:
      description: Assets are the resources that are protected by the authorization\n        system and are scoped to workspaces.
      enum:
      - feedback
      - feedback_management
      - files
      - indexes
      - jobs
      - secrets
      - shared_prototypes
      - pipelines
      - services
      - prompts
      - search_history
      - workspace_statistics
      - workspace_members
      - groundedness
      - api_keys
      - models
      - tool_registry
      - component_templates
      - mcp_server
      - skills
      - costs
      - '*'
      title: Assets
      type: string
    AssignedRoleRequest:
      properties:
        role_id:
          description: Unique identifier of the role.
          format: uuid
          title: Role ID
          type: string
        workspace_name:
          description: Name of the workspace.
          title: Workspace Name
          type: string
      required:
      - workspace_name
      - role_id
      title: AssignedRoleRequest
      type: object
    AutoCreateSecret:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: The name of the secret.
          title: Secret Name
        secret:
          description: The secret you want to add.
          title: Secret
          type: string
      type: object
  # ... (truncated for brevity)